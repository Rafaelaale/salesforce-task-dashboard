<template>
    <lightning-card title="Dashboard de Tarefas" icon-name="standard:task">
        <div class="slds-p-horizontal_medium slds-grid slds-gutters slds-wrap">
            <div class="slds-col slds-size_1-of-3">
                <lightning-combobox
                    label="Status"
                    value={statusFiltro}
                    options={opcoesStatus}
                    onchange={handleStatusChange}>
                </lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-combobox
                    label="Prioridade"
                    value={prioridadeFiltro}
                    options={opcoesPrioridade}
                    onchange={handlePrioridadeChange}>
                </lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-combobox
                    label="Prazo"
                    value={prazoFiltro}
                    options={opcoesPrazo}
                    onchange={handlePrazoChange}>
                </lightning-combobox>
            </div>
        </div>

        <div class="slds-p-horizontal_medium slds-p-top_small slds-grid slds-gutters">
            <div class="slds-col">
                <p class="slds-text-heading_small atrasada-label">Atrasadas: {totalAtrasadas}</p>
            </div>
            <div class="slds-col">
                <p class="slds-text-heading_small em-dia-label">Em dia: {totalEmDia}</p>
            </div>
        </div>

        <template lwc:if={erro}>
            <div class="slds-p-around_medium slds-text-color_error">
                Erro ao carregar tarefas: {erro}
            </div>
        </template>
        <template lwc:elseif={temTarefas}>
            <lightning-datatable
                key-field="Id"
                data={tarefas}
                columns={colunas}
                hide-checkbox-column>
            </lightning-datatable>
        </template>
        <template lwc:else>
            <div class="slds-p-around_medium slds-text-align_center">
                Nenhuma tarefa encontrada para os filtros selecionados.
            </div>
        </template>
    </lightning-card>
</template>
